[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pgmuvi"
# version = "0.0.1"
dynamic = ["version"]
authors = [
    {name = "Peter Scicluna", email = "peter.scicluna@eso.org"},
    {name = "Sundar Srinivasan", email = "s.srinivasan@irya.unam.mx"},
    {name = "Kathryn Jones", email = "kathryn.jones@unibe.ch"},
    {name = "Stefan Waterval", email = "sw4445@nyu.edu"},
    {name = "Diego Alejandro Vasquez-Torres", email = "d.vasquez@irya.unam.mx"},
    {name = "Sara Jamal", email = "jamal@mpia.de"},
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "A python package to interpret multiwavelength astronomical timeseries with GPs"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "torch>=2.0",
    "gpytorch>=1.11",
    "tqdm>=4.60",
    "astropy>=6.0",  # LombScargleMultiband
    "scipy>=1.10",
]

[project.optional-dependencies]
# MCMC (Lightcurve.mcmc and friends) is imported lazily; arviz 1.x dropped
# az.from_pyro, so stay below 1 until the MCMC rewrite (roadmap 4.8).
mcmc = ["pyro-ppl>=1.8", "arviz<1", "xarray"]
test = ["pytest>=7", "pytest-xdist"]
docs = ["sphinx>=7", "nbsphinx", "ipykernel"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/icsm/pgmuvi"
"Bug Tracker" = "https://github.com/icsm/pgmuvi/issues"

[tool.setuptools]
packages = ["pgmuvi", "pgmuvi.preprocess", "pgmuvi.datasets"]
include-package-data = false

[tool.setuptools.package-data]
"pgmuvi.datasets" = ["*.csv", "README.md"]

[tool.setuptools_scm]

[tool.ruff]
exclude = ["tests"]
# include notebooks!
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

[tool.ruff.lint]
select = ["A",  # prevent using keywords that clobber python builtins
          "B",  # bugbear: security warnings
          "E",  # pycodestyle
          "F",  # pyflakes
          "ISC",  # implicit string concatenation
          "UP",  # alert you when better syntax is available in your python version
          "RUF",  # the ruff developer's own rules
          "W",  # pycodestyle warnings

          ]
ignore = ["UP004", "B007", "ISC001"]  # ISC001 conflicts with formatter

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

