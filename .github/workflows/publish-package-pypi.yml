name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
    push:
        tags:
            - "v*"

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    env:
      UPLOAD_VALIDATION_SENTINEL: ${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}:PGMUVI_UPLOAD_VALIDATION_V1
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # fetch full history and tags for setuptools_scm versioning
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build and twine
      run: >-
        python3 -m
        pip install
        build
        twine
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check dist metadata
      run: python3 -m twine check dist/*
    - name: Create upload-validation sentinel
      run: >-
        printf '%s\n' '${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}:PGMUVI_UPLOAD_VALIDATION_V1'
        > dist/.upload_validation_sentinel
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pgmuvi/
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    env:
      UPLOAD_VALIDATION_SENTINEL: ${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}:PGMUVI_UPLOAD_VALIDATION_V1
      PYTHONPATH: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v4
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Validate latest uploaded dists
      run: >-
        python .github/scripts/validate_uploaded_artifacts.py
        --dist-dir dist
        --expected-version '${{ github.ref_name }}'
        --expected-sentinel '${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}:PGMUVI_UPLOAD_VALIDATION_V1'
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - uses: actions/checkout@v4
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Validate latest uploaded dists
      run: >-
        python .github/scripts/validate_uploaded_artifacts.py
        --dist-dir dist
        --expected-version '${{ github.ref_name }}'
        --expected-sentinel '${{ github.sha }}:${{ github.run_id }}:${{ github.run_attempt }}:PGMUVI_UPLOAD_VALIDATION_V1'
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.3.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release (if it does not already exist)
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Only create the release when it doesn't already exist (e.g. it was
      # created manually via the GitHub UI before or after pushing the tag).
      # --repo is passed explicitly even though this job checks out the repo.
      # Real failures (auth, network, etc.) in the create command still propagate.
      run: >-
        gh release view '${{ github.ref_name }}'
        --repo '${{ github.repository }}' 2>/dev/null
        || gh release create '${{ github.ref_name }}'
        --repo '${{ github.repository }}' --notes ""
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      # --clobber replaces any existing assets so reruns do not fail.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'
        --clobber

