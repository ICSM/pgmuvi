name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  strict-docs:
    name: Strict documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install pgmuvi with docs extras
        run: python -m pip install -e ".[docs]"
      - name: Build HTML with warnings as errors
        # Notebooks are rendered from their stored outputs, never executed
        # here; roadmap 3.13 decides which notebooks run in CI.
        run: make -C docs html-strict SPHINXOPTS="-D nbsphinx_execute=never"
