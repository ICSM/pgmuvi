name: Documentation

on:
  push:
  pull_request:

jobs:
  strict-docs:
    name: Strict Sphinx documentation build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/source/requirements.txt

      - name: Build documentation with warnings as errors
        run: |
          cd docs
          make html-strict
