name: Ruff

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run Ruff
      uses: astral-sh/ruff-action@v3
      with:
        version: "0.15.21"
        src: "./pgmuvi"
        args: "check -v --output-format=full --show-fixes"
