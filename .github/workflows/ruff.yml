name: Ruff

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          # Keep in step with .pre-commit-config.yaml and the `dev` extra.
          version: "0.16.9"
          src: "./pgmuvi"
          args: "check --output-format=github"
